name: Daily Supabase backup

# Phase E — off-site DB backup. Dumps full Supabase Postgres to a second R2 bucket.
# Recovery: see docs/BACKUP_RECOVERY.md.
on:
  schedule:
    # Daily at 03:17 UTC (off-peak; arbitrary minute to avoid the :00 stampede).
    - cron: '17 3 * * *'
  workflow_dispatch:  # allow manual runs from the Actions tab

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Postgres 17 client
        run: |
          sudo install -d /usr/share/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # Ubuntu runners ship pg16 in PATH; prepend pg17 binaries so pg_dump matches Supabase server version.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump + upload
        env:
          SUPABASE_DB_URL:        ${{ secrets.SUPABASE_DB_URL }}
          R2_BACKUP_ACCOUNT_ID:   ${{ secrets.R2_BACKUP_ACCOUNT_ID }}
          R2_BACKUP_ACCESS_KEY:   ${{ secrets.R2_BACKUP_ACCESS_KEY }}
          R2_BACKUP_SECRET_KEY:   ${{ secrets.R2_BACKUP_SECRET_KEY }}
          R2_BACKUP_BUCKET:       ${{ secrets.R2_BACKUP_BUCKET }}
        run: bash scripts/backup.sh
