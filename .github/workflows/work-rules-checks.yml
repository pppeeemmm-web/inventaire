name: Nightly work rule checks

# docs/WORK_RULES.md §6 (Pem's GO 2026-11-17): run supabase/sql/work_rules_checks.sql read only every
# night, after the 03:17 UTC backup. The job fails (GitHub emails) when a rule returns rows, and its log
# lists the breaking works. Same DB secret as backup.yml. The only write: one summary row in
# work_rule_run for the Overview « Système » signal (Pem 2026-11-18).
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Postgres 17 client
        run: |
          sudo install -d /usr/share/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Run rule checks (read only)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/work-rules-checks.sh
